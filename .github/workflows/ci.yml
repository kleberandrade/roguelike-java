name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: ./mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Exercise packaged game
        run: python scripts/smoke.py
      - name: Run domain example
        run: java --class-path target/classes examples/SurvivalExample.java
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
